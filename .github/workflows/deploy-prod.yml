name: Deploy (prod)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-prod
    runs-on: ubuntu-latest
    # Settings > Environments > production で Required reviewers を設定すると、
    # このジョブは承認されるまで開始されません。
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Write .env.production from secret
        run: printf '%s' "${{ secrets.ENV_PRODUCTION }}" > .env.production
      - run: npm run build:prod
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Deploy hosting + Firestore rules (prod)
        run: firebase deploy --only hosting,firestore:rules -P prod --non-interactive
