name: Deploy (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-dev
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Write .env.development from secret
        run: printf '%s' "${{ secrets.ENV_DEVELOPMENT }}" > .env.development
      - run: npm run build:dev
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Deploy hosting + Firestore rules (dev)
        run: firebase deploy --only hosting,firestore:rules -P dev --non-interactive
